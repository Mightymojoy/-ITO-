<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITO 电商渠道业绩监控系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1d1d1f;padding:20px}
.dashboard{max-width:1440px;margin:0 auto}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:16px;color:#fff;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-left i{font-size:26px;color:#ffd700}
.header-left h1{font-size:20px;font-weight:600}
.header-left .sub{font-size:12px;opacity:.8;margin-left:8px}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.update-badge{background:rgba(255,255,255,.15);padding:5px 14px;border-radius:30px;font-size:12px}
.date-picker{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:30px}
.date-picker input[type=date]{background:transparent;border:none;color:#fff;font-size:12px;padding:4px 2px;outline:none;cursor:pointer;width:105px}
.date-picker input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
.date-picker span{color:rgba(255,255,255,.6);font-size:12px}
.btn-refresh{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 14px;border-radius:30px;cursor:pointer;font-size:12px;transition:.2s}
.btn-refresh:hover{background:rgba(255,255,255,.25)}

/* Filter Bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;background:#fff;border-radius:14px;padding:12px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.filter-bar .label{font-size:13px;font-weight:500;color:#374151}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{padding:4px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1.5px solid #d1d5db;background:#fff;color:#374151;transition:.15s;white-space:nowrap}
.filter-btn:hover{border-color:#2a5298;color:#2a5298}
.filter-btn.active{background:#1e3c72;color:#fff;border-color:#1e3c72}
.filter-btn.group-btn{font-weight:600}
.filter-btn.leaf-btn{font-weight:400}
.filter-btn.summary-btn{background:#f0fdf4;border-color:#86efac;color:#166534;font-weight:600}
.filter-btn.summary-btn.active{background:#166534;color:#fff;border-color:#166534}

/* KPI Row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .15s}
.kpi-card:hover{transform:translateY(-1px)}
.kpi-card .label{font-size:13px;color:#6b7280;font-weight:500;margin-bottom:4px}
.kpi-card .value{font-size:28px;font-weight:700;color:#1e3c72;letter-spacing:-.5px}
.kpi-card .value small{font-size:14px;font-weight:400;color:#6b7280;margin-left:4px}
.kpi-card .sub-info{font-size:12px;color:#6b7280;margin-top:4px}
.kpi-card .sub-info .up{color:#059669;font-weight:600}
.kpi-card .sub-info .down{color:#dc2626;font-weight:600}

/* Group Summary Cards */
.group-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.group-card{background:linear-gradient(135deg,#f8fafc,#fff);border-radius:14px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #2a5298;cursor:pointer;transition:.2s;position:relative}
.group-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.group-card .g-label{font-size:12px;color:#6b7280;font-weight:500;margin-bottom:2px}
.group-card .g-value{font-size:22px;font-weight:700;color:#1e3c72;letter-spacing:-.5px}
.group-card .g-sub{font-size:11px;color:#6b7280;margin-top:2px}
.group-card .g-check{position:absolute;top:8px;right:10px;font-size:14px;color:#2a5298;opacity:0;transition:.2s}
.group-card.active{border-left-color:#059669;background:linear-gradient(135deg,#f0fdf4,#fff)}
.group-card.active .g-check{opacity:1}
.group-card .g-badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:10px;font-weight:600;margin-left:4px}
.group-card .g-badge.up{background:#d1fae5;color:#065f46}
.group-card .g-badge.down{background:#fee2e2;color:#991b1b}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-header h3{font-size:15px;font-weight:600;color:#1e293b}
.card-header .tag{font-size:11px;color:#6b7280;background:#f1f5f9;padding:2px 12px;border-radius:20px}
.chart-box{position:relative;height:280px}

/* Trend */
.trend-card{margin-bottom:20px}
.trend-card .chart-box{height:260px}

/* Table */
.table-wrapper{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;margin-bottom:20px}
.table-wrapper .t-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;gap:10px}
.table-wrapper .t-header h3{font-size:15px;font-weight:600}
.table-wrapper .t-header .t-info{font-size:12px;color:#6b7280}
.scroll-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:#475569;font-weight:600;border-bottom:2px solid #e2e8f0;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#1e293b;white-space:nowrap}
tr:hover td{background:#f8fafc}
tr.group-row td{background:#f0fdf4;font-weight:600}
tr.group-row td:first-child{padding-left:12px}
tr.total-row td{background:#f1f5f9;font-weight:700;border-top:2px solid #d1d5db}
td .pct{font-size:11px;padding:1px 8px;border-radius:10px;display:inline-block}
td .pct.green{background:#d1fae5;color:#065f46}
td .pct.red{background:#fee2e2;color:#991b1b}
td .pct.yellow{background:#fef3c7;color:#92400e}

/* Responsive */
@media(max-width:1024px){.kpi-row,.group-grid,.chart-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.kpi-row,.group-grid,.chart-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="dashboard" id="app">

<!-- Header -->
<header class="header">
  <div class="header-left">
    <i class="fas fa-chart-line"></i>
    <h1>ITO 电商渠道业绩监控</h1>
    <span class="sub">📊 实时看板</span>
  </div>
  <div class="header-right">
    <div class="date-picker">
      <input type="date" id="startDate">
      <span>~</span>
      <input type="date" id="endDate">
    </div>
    <button class="btn-refresh" onclick="applyFilters()"><i class="fas fa-sync-alt"></i> 刷新</button>
    <span class="update-badge"><i class="far fa-calendar-alt"></i> 截至 <span id="dataUntil"></span></span>
  </div>
</header>

<!-- Filter Bar -->
<div class="filter-bar">
  <span class="label"><i class="fas fa-filter"></i> 渠道筛选</span>
  <div class="filter-btns" id="filterBtns"></div>
  <span style="font-size:11px;color:#9ca3af;margin-left:4px" id="selectedHint">已选: 全部</span>
</div>

<!-- Group Summary Cards -->
<div class="group-grid" id="groupCards"></div>

<!-- KPI Row -->
<div class="kpi-row" id="kpiRow"></div>

<!-- Charts -->
<div class="chart-grid">
  <div class="card">
    <div class="card-header">
      <h3>渠道销售占比</h3>
      <span class="tag" id="pieTag">...</span>
    </div>
    <div class="chart-box"><canvas id="pieChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3>渠道实际 vs 目标</h3>
      <span class="tag" id="barTag">...</span>
    </div>
    <div class="chart-box"><canvas id="barChart"></canvas></div>
  </div>
</div>

<!-- Trend -->
<div class="card trend-card">
  <div class="card-header">
    <h3><i class="fas fa-chart-line"></i> 销售趋势 (日度)</h3>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="tag" id="trendTag">...</span>
      <label style="font-size:12px;color:#6b7280"><input type="checkbox" id="showTarget" checked> 显示目标</label>
      <label style="font-size:12px;color:#6b7280"><input type="checkbox" id="showPrev" checked> 显示上期</label>
    </div>
  </div>
  <div class="chart-box"><canvas id="trendChart"></canvas></div>
</div>

<!-- Table -->
<div class="table-wrapper">
  <div class="t-header">
    <div>
      <h3>渠道业绩明细</h3>
      <div class="t-info">单位: 元 | <span id="tablePeriod">...</span></div>
    </div>
  </div>
  <div class="scroll-wrap">
    <table>
      <thead>
        <tr>
          <th>渠道</th>
          <th style="text-align:right">预算目标(年初)</th>
          <th style="text-align:right">目标(月度)</th>
          <th style="text-align:right">实际+预估</th>
          <th style="text-align:right">去年同期销售</th>
          <th style="text-align:right">预算达成率</th>
          <th style="text-align:right">目标达成率</th>
          <th style="text-align:right">环比</th>
          <th style="text-align:right">同比</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

</div>

let pieChart = null, barChart = null, trendChart = null;

};

// 基准日期：2026-06-01 为"今天"，之前日期用实际，之后日期用目标
const TODAY='2026-07-03';

// ========== Helpers ==========
function fmt(v){return Math.round(v).toLocaleString('zh-CN')}
function fmtW(v){return (v/10000).toFixed(1)+'万'}
function pct(a,b){if(!b||b===0)return'-';return((a/b)*100).toFixed(1)+'%'}
function pctColor(v){if(v==='-')return'';const n=parseFloat(v);if(n>=100)return'green';if(n>=80)return'yellow';return'red'}
function diffPct(curr,prev){if(!prev||prev===0)return'-';return(((curr-prev)/prev)*100).toFixed(1)+'%'}
function diffColor(v){if(v==='-')return'';const n=parseFloat(v);return n>=0?'green':'red'}

function parseDate(d){const p=d.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

// ========== Data Access ==========
function getData(channel,dateStr){
  const d=RAW_DATA.data;
  if(!d[channel])return null;
  return d[channel][dateStr]||null;
}

function sumChannel(channels,dateStr){
  let r={actual:0,budget_target:0,operating_target:0,target:0,combined_forecast:0,actual_forecast:0};
  channels.forEach(ch=>{
    const e=getData(ch,dateStr);
    if(e){
      r.actual+=e.actual||0;
      r.budget_target+=e.budget_target||0;
      r.operating_target+=e.operating_target||0;
      r.target+=e.target||0;
      r.combined_forecast+=e.combined_forecast||0;
    }
  });
  // 实际+预估：已过日期(<TODAY)用实际，今天及未来用G列(预估+目标/预估+目标（年初预算）)
  if(dateStr<TODAY){
    r.actual_forecast=r.actual;
  }else{
    r.actual_forecast=r.combined_forecast||r.operating_target||r.target||r.budget_target||0;
  }
  return r;
}

function getVisibleChannels(){
  if(selectedChannels.size===0)return CHANNEL_ORDER;
  // 如果选了组，展开
  const result=new Set();
  selectedChannels.forEach(k=>{
    if(GROUPS[k])GROUPS[k].forEach(c=>result.add(c));
    else result.add(k);
  });
  return CHANNEL_ORDER.filter(c=>result.has(c));
}

function isGroupSelected(gk){
  const children=GROUPS[gk];
  if(!children)return false;
  if(selectedChannels.size===0)return true;
  return selectedChannels.has(gk)||children.every(c=>selectedChannels.has(c));
}

function getActiveGroups(){
  if(selectedChannels.size===0)return Object.keys(GROUPS);
  const gs=[];
  Object.keys(GROUPS).forEach(gk=>{
    if(selectedChannels.has(gk))gs.push(gk);
  });
  return gs;
}

// ========== Date Helpers ==========
function getDateRange(){
  const s=document.getElementById('startDate').value;
  const e=document.getElementById('endDate').value;
  if(!s||!e)return null;
  return {start:s,end:e};
}

function getDatesInRange(start,end){
  const dates=[];
  let d=new Date(start);
  const endD=new Date(end);
  while(d<=endD){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    dates.push(ds);
    d.setDate(d.getDate()+1);
  }
  return dates;
}

function getPrevPeriod(start,end){
  const sd=parseDate(start);
  const ed=parseDate(end);
  const dayCount=Math.round((ed-sd)/86400000)+1;
  // MTD: 上月同日，保持天数一致
  const pm=new Date(sd.getFullYear(),sd.getMonth()-1,1);
  const daysInPM=new Date(sd.getFullYear(),sd.getMonth(),0).getDate();
  const peDay=Math.min(ed.getDate(),daysInPM);
  const pe=new Date(pm.getFullYear(),pm.getMonth(),peDay);
  return {
    start:fmtDate(pm),
    end:fmtDate(pe)
  };
}

function getYoYPeriod(start,end){
  const s2=new Date(parseDate(start));
  s2.setFullYear(s2.getFullYear()-1);
  const e2=new Date(parseDate(end));
  e2.setFullYear(e2.getFullYear()-1);
  return {
    start:fmtDate(s2),
    end:fmtDate(e2)
  };
}

function sumRange(channels,start,end){
  const dates=getDatesInRange(start,end);
  const total={actual:0,budget_target:0,operating_target:0,target:0,actual_forecast:0,combined_forecast:0};
  dates.forEach(d=>{
    const r=sumChannel(channels,d);
    total.actual+=r.actual;
    total.budget_target+=r.budget_target;
    total.operating_target+=r.operating_target;
    total.target+=r.target;
    total.actual_forecast+=r.actual_forecast;
    total.combined_forecast+=r.combined_forecast;
  });
  return total;
}

// ========== Render ==========

  let groupHtml='';

    const d=curr[gk]||{actual:0,budget_target:0,operating_target:0,actual_forecast:0};

    const dy=yoyData[gk]||{actual:0};

  });

  let filterHtml='';

    filterHtml+='<button class="filter-btn leaf-btn'+(sel?' active':'')+'" onclick="toggleFilter(\''+ch+'\')">'+ch+'</button>';
  });
  filterHtml+='<button class="filter-btn summary-btn'+(selectedChannels.size===0?' active':'')+'" onclick="selectAll()">全选</button>';
  document.getElementById('filterBtns').innerHTML=filterHtml;

  // 已选提示
  const selCount=selectedChannels.size===0?CHANNEL_ORDER.length+Object.keys(GROUPS).length:selectedChannels.size;
  document.getElementById('selectedHint').textContent='已选: '+selCount+' 项';

  // ---- Table ----
  document.getElementById('tablePeriod').textContent=start+' ~ '+end+' ('+dayCount+'天)';
  let tbody='';

  // 汇总组行（仅显示与可见渠道相关的组）
  Object.keys(GROUPS).forEach(gk=>{
    const groupChildren=GROUPS[gk];
    // 如果筛选了渠道但该组没有任何可见渠道，跳过
    if(selectedChannels.size>0 && !visibleChs.some(c=>groupChildren.includes(c))) return;
    const d=curr[gk]||{actual:0,budget_target:0,operating_target:0,forecast:0,actual_forecast:0};
    const dp=prevData[gk]||{actual:0};
    const dy=yoyData[gk]||{actual:0};
    const pMot=diffPct(d.actual,dp.actual);
    const pYoy=diffPct(d.actual,dy.actual);
    tbody+='<tr class="group-row">'+
      '<td><strong>'+gk+'</strong></td>'+
      '<td style="text-align:right">'+fmt(d.budget_target)+'</td>'+
      '<td style="text-align:right">'+fmt(d.operating_target)+'</td>'+
      '<td style="text-align:right"><strong>'+fmt(d.actual_forecast)+'</strong></td>'+
      '<td style="text-align:right">'+fmt(dy.actual)+'</td>'+
      '<td style="text-align:right"><span class="pct '+pctColor(pct(d.actual_forecast,d.budget_target))+'">'+pct(d.actual_forecast,d.budget_target)+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+pctColor(pct(d.actual_forecast,d.operating_target))+'">'+pct(d.actual_forecast,d.operating_target)+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+diffColor(pMot)+'">'+pMot+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+diffColor(pYoy)+'">'+pYoy+'</span></td></tr>';
  });

  // 叶子渠道行（仅显示已筛选的）
  const displayLeaf=visibleChs.length>0?visibleChs:CHANNEL_ORDER;
  displayLeaf.forEach(ch=>{
    const d=curr[ch]||{actual:0,budget_target:0,operating_target:0,actual_forecast:0};
    const dp=prevData[ch]||{actual:0};
    const dy=yoyData[ch]||{actual:0};
    const pMot=diffPct(d.actual,dp.actual);
    const pYoy=diffPct(d.actual,dy.actual);
    tbody+='<tr>'+
      '<td>'+ch+'</td>'+
      '<td style="text-align:right">'+fmt(d.budget_target)+'</td>'+
      '<td style="text-align:right">'+fmt(d.operating_target)+'</td>'+
      '<td style="text-align:right"><strong>'+fmt(d.actual_forecast)+'</strong></td>'+
      '<td style="text-align:right">'+fmt(dy.actual)+'</td>'+
      '<td style="text-align:right"><span class="pct '+pctColor(pct(d.actual_forecast,d.budget_target))+'">'+pct(d.actual_forecast,d.budget_target)+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+pctColor(pct(d.actual_forecast,d.operating_target))+'">'+pct(d.actual_forecast,d.operating_target)+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+diffColor(pMot)+'">'+pMot+'</span></td>'+
      '<td style="text-align:right"><span class="pct '+diffColor(pYoy)+'">'+pYoy+'</span></td></tr>';
  });

  // 合计行
  tbody+='<tr class="total-row">'+
    '<td>合计 ('+displayLeaf.length+'个渠道)</td>'+
    '<td style="text-align:right">'+fmt(totalAll.budget_target)+'</td>'+
    '<td style="text-align:right">'+fmt(totalAll.operating_target)+'</td>'+
    '<td style="text-align:right"><strong>'+fmt(totalAll.actual_forecast)+'</strong></td>'+
    '<td style="text-align:right">'+fmt(totalYoy.actual)+'</td>'+
    '<td style="text-align:right"><span class="pct '+pctColor(pct(totalAll.actual_forecast,totalAll.budget_target))+'">'+pct(totalAll.actual_forecast,totalAll.budget_target)+'</span></td>'+
    '<td style="text-align:right"><span class="pct '+pctColor(pct(totalAll.actual_forecast,totalAll.operating_target))+'">'+pct(totalAll.actual_forecast,totalAll.operating_target)+'</span></td>'+
    '<td style="text-align:right"><span class="pct '+diffColor(diffPct(totalAll.actual,totalPrev.actual))+'">'+diffPct(totalAll.actual,totalPrev.actual)+'</span></td>'+
    '<td style="text-align:right"><span class="pct '+diffColor(diffPct(totalAll.actual,totalYoy.actual))+'">'+diffPct(totalAll.actual,totalYoy.actual)+'</span></td></tr>';

  document.getElementById('tableBody').innerHTML=tbody;

  // ---- Charts ----
  document.getElementById('pieTag').textContent=start+' ~ '+end;
  document.getElementById('barTag').textContent=start+' ~ '+end;
  document.getElementById('trendTag').textContent=start+' ~ '+end;

  // visibleChs 已在行378声明，直接使用
  updatePieChart(visibleChs,curr);
  updateBarChart(visibleChs,curr);
  updateTrendChart(visibleChs,start,end);
}

// ========== Chart Updates ==========
function updatePieChart(channels,curr){
  const labels=[],data=[],colors=[];
  const palette=['#2e7d32','#1565c0','#e65100','#7b1fa2','#00838f','#f9a825','#c62828','#4e342e','#37474f'];
  channels.forEach((ch,i)=>{
    const d=curr[ch]||{actual:0};
    if(d.actual>0){
      labels.push(ch);
      data.push(d.actual);
      colors.push(palette[i%palette.length]);
    }
  });
  if(pieChart){pieChart.destroy();pieChart=null}
  const totalPie=data.reduce((a,b)=>a+b,0);
  pieChart=new Chart(document.getElementById('pieChart'),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{
        padding:12,usePointStyle:true,font:{size:11},
        generateLabels:function(chart){
          const ds=chart.data.datasets[0];
          const total=ds.data.reduce((a,b)=>a+b,0);
          return chart.data.labels.map((l,i)=>{
            const val=ds.data[i];
            const pct=total>0?(val/total*100).toFixed(1):'0.0';
            return {text:l+'  ¥'+fmt(val)+'  ('+pct+'%)',fillStyle:ds.backgroundColor[i],hidden:false,strokeStyle:'transparent',pointStyle:'circle'};
          });
        }
      }},tooltip:{
        callbacks:{
          label:function(ctx){
            const val=ctx.parsed;
            const pct=totalPie>0?(val/totalPie*100).toFixed(1):'0.0';
            return ' ¥'+fmt(val)+'  ('+pct+'%)';
          }
        }
      }}
    }
  });
}

function updateBarChart(channels,curr){
  const labels=channels;
  const actual=channels.map(ch=>(curr[ch]||{actual:0}).actual);
  const target=channels.map(ch=>(curr[ch]||{target:0,operating_target:0,budget_target:0}).target||(curr[ch]||{}).operating_target||(curr[ch]||{}).budget_target||0);
  if(barChart){barChart.destroy();barChart=null}
  barChart=new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'实际',data:actual,backgroundColor:'#2e7d32',borderRadius:4},
      {label:'目标',data:target,backgroundColor:'#b0bec5',borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtW(v)}}},
      plugins:{legend:{position:'top',labels:{usePointStyle:true,font:{size:11}}}}}
  });
}

function updateTrendChart(channels,start,end){
  const dates=getDatesInRange(start,end);
  if(dates.length===0)return;
  const showTarget=document.getElementById('showTarget').checked;
  const showPrev=document.getElementById('showPrev').checked;

  // 实际日趋势
  const actualData=dates.map(d=>sumChannel(channels,d).actual);
  // 目标日趋势
  const targetData=showTarget?dates.map(d=>sumChannel(channels,d).target||sumChannel(channels,d).operating_target||sumChannel(channels,d).budget_target||0):null;
  // 上期趋势（MTD对齐：同月天数偏移）
  let prevData2=null;
  if(showPrev){
    const prev=getPrevPeriod(start,end);
    const pDates=getDatesInRange(prev.start,prev.end);
    prevData2=pDates.map(d=>sumChannel(channels,d).actual);
  }

  if(trendChart){trendChart.destroy();trendChart=null}

  const datasets=[{
    label:'实际销售额',
    data:actualData,
    borderColor:'#1e3c72',
    backgroundColor:'rgba(30,60,114,0.08)',
    fill:true,
    tension:.3,
    pointRadius:2,
    borderWidth:2
  }];

  if(targetData){
    datasets.push({
      label:'目标',
      data:targetData,
      borderColor:'#d97706',
      borderDash:[5,5],
      tension:.3,
      pointRadius:0,
      borderWidth:1.5
    });
  }

  if(prevData2){
    datasets.push({
      label:'上期实际',
      data:prevData2,
      borderColor:'#9ca3af',
      borderDash:[3,3],
      tension:.3,
      pointRadius:0,
      borderWidth:1
    });
  }

  // 显示日期标签：隔几天显示一个
  const maxLabels=Math.min(dates.length,30);
  const step=Math.max(1,Math.floor(dates.length/maxLabels));
  const xLabels=dates.map((d,i)=>i%step===0?d.slice(5):'');

  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{labels:xLabels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtW(v)}}},
      plugins:{legend:{position:'top',labels:{usePointStyle:true,font:{size:11}},
        tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': ¥'+fmt(ctx.raw)}}}}}
  });

  document.getElementById('showTarget').onchange=()=>updateTrendChart(channels,start,end);
  document.getElementById('showPrev').onchange=()=>updateTrendChart(channels,start,end);
}

// ========== Filter Actions ==========
function toggleFilter(key){
  if(selectedChannels.size===0){
    // 全选状态 -> 只选这个
    selectedChannels=new Set([key]);
  }else if(selectedChannels.has(key)){
    selectedChannels.delete(key);
    if(selectedChannels.size===0){
      // 全选
    }
  }else{
    selectedChannels.add(key);
  }
  render();
}

function toggleGroup(gk){
  toggleFilter(gk);
}

function selectAll(){
  selectedChannels=new Set();
  render();
}

function applyFilters(){
  render();
}

// ========== Init ==========
function init(){
  // 设置日期默认值：最近30天
  const today=new Date();
  const endStr=fmtDate(today);
  const startD=new Date(today);
  startD.setDate(startD.getDate()-30);
  const startStr=fmtDate(startD);

  document.getElementById('startDate').value=startStr;
  document.getElementById('endDate').value=endStr;

  // 设置数据截止日期
  const dates=Object.keys(RAW_DATA.data[Object.keys(RAW_DATA.data)[0]]||{});
  document.getElementById('dataUntil').textContent=dates[dates.length-1]||endStr;

  render();
}

init();
</script>
